# Read by KDE CI's craft_windows_qt6_x86_64 job (see .gitlab-ci.yml) as a
# CraftMaster --config-override. Points Craft at this repo's own bundled
# copy of the qt-apps/seabass blueprint (craft-blueprint/qt-apps/seabass/),
# so CI can resolve it without depending on an upstream contribution to
# craft-blueprints-community landing first.
#
# ${Env:CI_PROJECT_DIR} resolves via CraftMaster's Config class, which
# copies the whole OS environment into an [Env] section readable through
# ExtendedInterpolation (craftmaster/Config.py) -- confirmed by reading
# that source, not yet confirmed by an actual CI run. CI_PROJECT_DIR is
# the root GitLab checks the repo out under; the actual checkout lands at
# $CI_PROJECT_DIR/src/ per windows-base.yml's gitlab-ci-clone.py step.
#
# This replaces Craft's default [Blueprints] Locations value rather than
# extending it, but that's fine here: craft-blueprints-kde (where Qt6,
# zlib, sqlite, sqlcipher and taglib all live) is auto-discovered by
# directory listing regardless of this key -- only the explicit
# community-repo fallback is lost, and Seabass's blueprint doesn't need
# anything from there.
[GeneralSettings]
Blueprints/Locations = ${Env:CI_PROJECT_DIR}/src/craft-blueprint
