# Read by KDE CI's craft_windows_qt6_x86_64 and craft_macos_qt6_arm64 jobs
# (see .gitlab-ci.yml) as a CraftMaster --config-override: both base
# templates set KDECI_CRAFT_PROJECT_CONFIG to $CI_PROJECT_DIR/src/.craft.ini
# and pass it unconditionally, creating an empty one when a repo has none.
# Points Craft at this repo's own bundled copy of the qt-apps/seabass
# blueprint (craft-blueprint/qt-apps/seabass/), so CI can resolve it
# without depending on an upstream contribution to
# craft-blueprints-community landing first.
#
# ${Env:CI_PROJECT_DIR} resolves via CraftMaster's Config class, which
# copies the whole OS environment into an [Env] section readable through
# ExtendedInterpolation (craftmaster/Config.py) -- confirmed by reading
# that source, not yet confirmed by an actual CI run. CI_PROJECT_DIR is
# the root GitLab checks the repo out under; the actual checkout lands at
# $CI_PROJECT_DIR/src/, per the gitlab-ci-clone.py step both base
# templates run (and which also does `git submodule update --init
# --recursive`, so third_party/libdjinterop and the Kaitai runtime are
# there before Craft starts).
#
# This replaces Craft's default [Blueprints] Locations value rather than
# extending it, but that's fine here, and nothing in KDE's own CI config
# is lost with it: craft-ci/qt6/CraftConfig.ini sets Blueprints/
# BlueprintRoot and never Locations, and craft-blueprints-kde (where Qt6,
# zlib, sqlite, openssl, tcl and taglib all live) is found by listing
# that root regardless of this key. Only the explicit community-repo
# fallback is lost, and Seabass's blueprint needs nothing from there.
[GeneralSettings]
Blueprints/Locations = ${Env:CI_PROJECT_DIR}/src/craft-blueprint
