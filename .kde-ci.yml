# Read by KDE's standard build jobs (sysadmin/ci-utilities,
# run-ci-build.py), which .gitlab-ci.yml includes as linux-qt6.yml and
# windows-qt6.yml. Every option and its default is
# in ci-utilities' config/global.yml.
#
# No Dependencies: Seabass builds against Qt and system libraries the CI
# images already carry (SQLCipher, TagLib, SQLite, zlib), and against no
# other KDE project.

Options:
  # An application, so the build that is tested is the one that ships.
  # The default is Debug. Assertions stay on either way: CMakeLists.txt
  # puts -UNDEBUG on every test target.
  release-build: True

  # The runner keeps a compiler cache between jobs; it is off by default.
  use-ccache: True

  # libdjinterop's own suite wants Boost.Filesystem and is not ours to
  # keep green: the same switch the Craft blueprint passes.
  #
  # SEABASS_REQUIRE_ZIP_TOOLS=OFF because the CI images do not all carry
  # unzip and 7z, which the tests otherwise refuse to configure without:
  # the backup archive is then checked against Python's zipfile, and
  # against unzip and 7z on the images that have them. See CMakeLists.txt.
  #
  # SEABASS_REQUIRE_FAT_TOOLS stays at its default, ON: the openSUSE image
  # has mkfs.fat and fsck.fat, in /usr/sbin, which is off the job's PATH
  # and where CMake looks all the same (pipeline 1419949). Should an image
  # lose them the configure says so, and that is the moment to decide.
  cmake-options: '-DSEABASS_LIBDJINTEROP_TESTS=OFF -DSEABASS_REQUIRE_ZIP_TOOLS=OFF'

  # sleep_inhibitor_test asks logind for a real inhibitor. The CI VMs have
  # a logind, and it refuses one to a session with nobody to authenticate
  # ("requires interactive authentication"), so the test cannot pass
  # there. It runs everywhere else, tools/pre-push-check.sh included.
  ctest-arguments: '-E "^sleep_inhibitor_test$"'

  # ctest -j over the machine's cores. The default is one test at a time.
  tests-run-in-parallel: True

  # For a test that sets no TIMEOUT of its own. The default is 60, the
  # most that is taken is 1000.
  #
  # 900, because the tests that write a whole library run as long as the
  # runner's disk takes to sync, and the runner is a VM that shares its
  # host's disk with other jobs. With a second Seabass pipeline on the
  # same host (node4-vmrunner, pipelines 1421380 and 1421389, pushed four
  # minutes apart) the integration tests took 1186 s between them where
  # they take 364 s alone: rekordbox_cue_writer_every_track_test and
  # library_backup_roundtrip_test ran into 300 s while still working
  # (48 s and 51 s alone), backup_fingerprint_describes_archive_test
  # passed at 286 s. A test that hangs costs fifteen minutes here
  # instead of five.
  per-test-timeout: 900

  # The tests run on Linux. The Windows job builds and stops there (the
  # default is to test on Windows as well).
  #
  # The suite does not fit in that job's hour. The one run it had
  # (pipeline 1418451) was killed at the hour with tests still running,
  # after a 27 minute build. The 368 tests that had reported by then took
  # 23636 s of test time between them, against 2608 s for the same tests
  # on Linux; the ones that mostly read and write small files took a
  # hundred times as long or more (owned_change_test 2 s and 165 s), and
  # 33 ran into the 300 s limit while still printing passing cases. What
  # makes that machine so slow at it has not been measured. One test
  # failed outright: qt_decoder_timeline_test, "Failed to initialize
  # Windows Media Foundation".
  run-tests-on: ['Linux']

  # Without this a failing suite leaves the job green.
  require-passing-tests-on: ['Linux']
