# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/dependency_scanning_sbom/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
stages:
- test
- secret-detection
- deploy
sast:
  stage: test
include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml
# Craft/MSVC Windows build+installer, same toolchain verified locally.
# The `craft_windows_qt6_x86_64` job it defines only runs automatically
# on mainline KDE repos ($KDECI_SECURE_SERVICES_KEY); everywhere else,
# including here, it appears as a manual pipeline job -- exactly what's
# needed to test the Craft build on KDE's real Windows CI runners without
# requiring mainline status or signing to be set up first.
#
# The qt-apps/seabass blueprint (craft-blueprint/qt-apps/seabass/) ships
# inside this repo rather than craft-blueprints-community, so CI doesn't
# depend on an upstream contribution landing first -- confirmed locally
# that Craft resolves a blueprint from an arbitrary [Blueprints]
# Locations entry with no dependency on the community repo at all. The
# .craft.ini in this checkout is what points Locations there; both the
# Windows and the macOS base template read it as CraftMaster's
# --config-override ($KDECI_CRAFT_PROJECT_CONFIG), so it needs no job of
# its own. Upstream to craft-blueprints-community once this has a real CI
# run behind it.
- project: sysadmin/ci-utilities
  file: /gitlab-templates/craft-windows-x86-64-qt6.yml

# macOS. The same blueprint, the same .craft.ini, a signed and notarized
# .dmg out the far end.
#
# There is no plain build-and-test template for macOS on Invent -- the
# whole macOS lane is Craft -- so this job packages, it does not run the
# test suite. Two reasons it cannot: craft-ci's CraftConfig.ini sets
# `/.buildTests = False` for every blueprint, and Craft carries only
# Boost's headers, while libdjinterop's vendored test suite wants
# Boost.Filesystem compiled. That is the same reason the blueprint
# configures -DSEABASS_TESTS=OFF. So a green job here means "it builds,
# links and packages on macOS", not "the 152 tests pass" -- those stay
# local until this repo has a .kde-ci.yml and a Linux build job.
#
# arm64 only, on purpose. KDE has a single macOS builder and both targets
# queue on it; the Intel one (craft-macos-x86-64-qt6.yml) cross-compiles
# on that same ARM machine, so it is a second, less-tested path for a
# device we have no way to verify on. Worth adding once arm64 has some
# green runs behind it.
#
# Verified locally before enabling: this blueprint produces
# seabass-macos-build-master-macos-clang-arm64.dmg (58 MB) against the
# same General/ABI = macos-clang-arm64 the CI target uses.
#
# Note the template's own rules run this automatically once
# $KDECI_SECURE_SERVICES_KEY is set, which it now is: Apple will not let
# an unsigned .dmg be useful, so the job signs, notarizes and publishes
# the build. Unlike the Windows job below, no allow_failure is added --
# nothing is known to be broken here, and a first run that fails should
# say so loudly rather than sit orange.
- project: sysadmin/ci-utilities
  file: /gitlab-templates/craft-macos-arm64-qt6.yml
variables:
  SECRET_DETECTION_ENABLED: 'true'
secret_detection:
  stage: secret-detection

# REUSE 3.0 compliance, as the KDE licensing policy requires: every file
# carries copyright and an SPDX licence identifier, and every licence used
# has its text in LICENSES/. Runs on the official FSFE image so the check
# is the same one reuse.software publishes.
reuse:
  stage: test
  image:
    name: fsfe/reuse:latest
    entrypoint: [""]
  script:
  - reuse lint

# --- Windows Craft build: still runs and still reports, but does not
# --- fail the pipeline while a dependency of ours is broken upstream.
#
# Temporary, and dated: remove once libvpx builds on MSVC again.
#
# craft-blueprints-kde broke it on 2026-09-17 (06a004fb, "[libvpx] Update
# to 1.16.0 and enable on MSVC"). Its postInstall moves two files on MSVC
# and one of them is never produced:
#
#   [Errno 2] No such file or directory:
#     ...\libs\libvpx\image-RelWithDebInfo-1.16.0-dbg\lib\x64\vpxmd.pdb
#   Action: post-install for libs/libvpx:1.16.0 FAILED
#
# libvpx itself compiles cleanly; the packaging step after it is what
# fails. Seabass reaches libvpx through qtmultimedia -> ffmpeg, so the
# build dies in --install-deps, long before any Seabass code is compiled.
# Nothing here caused it and nothing here can fix it.
#
# It only began failing the pipeline when this repo gained KDE mainline
# status: the shared template (sysadmin/craft-ci,
# gitlab-templates/blocks/windows-base.yml) runs the job automatically
# wherever $KDECI_SECURE_SERVICES_KEY is set, and that rule leaves
# allow_failure at its default of false. Before the key existed the job
# was manual and explicitly allow_failure: true, so a broken dependency
# went unnoticed.
#
# The rules below are the template's own, with allow_failure added to the
# automatic branch. Written out in full rather than setting allow_failure
# at job level, because a matching rule supplies its own allow_failure
# and a job-level value would not reliably win. Overriding `rules`
# replaces the template's list outright; every other key of the job --
# image, tags, script, artifacts -- still comes from the template.
craft_windows_qt6_x86_64:
  rules:
  - if: $KDECI_SECURE_SERVICES_KEY
    when: on_success
    allow_failure: true
  - when: manual
    allow_failure: true
