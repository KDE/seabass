# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/dependency_scanning_sbom/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
stages:
- build
- test
- package
- installer-test
- secret-detection
- deploy
# `needs: []` on the checks below, and the reason is not speed.
#
# Stage order means every job in `test` waits for `build` to succeed.
# linux:build sat in `build` and never once passed, so for the whole time
# this lane has existed master has not had a red licence check and a red
# security check -- it has had NO licence check and NO security check,
# both stuck at `created`, along with the macOS build. The project was
# not failing those gates, it was blind to them. The .gitlab-ci.yml
# history already records this happening once before, when a `tags:` line
# nothing answered to "took every other job of every pipeline down with
# it, including the macOS build that was working".
#
# An empty `needs:` detaches a job from stage ordering entirely, so it
# starts at once and answers for itself. These three check the SOURCE and
# need nothing built: reuse lints file headers, and the two scanners read
# the tree. Nothing they look at can be affected by whether the compiler
# succeeded, so making them wait for it only ever loses information.
#
# Deliberately NOT applied to the packaging and deploy jobs: a package
# built from a tree whose tests failed is exactly what stage order should
# keep from being produced.
sast:
  stage: test
  needs: []
semgrep-sast:
  # The SAST template generates this as a concrete job; overriding `sast`
  # above does not reach it, so it is detached by name too. Without this
  # the security scan keeps waiting for a build it does not use.
  needs: []
include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml
# Craft/MSVC Windows build+installer, same toolchain verified locally.
# The `craft_windows_qt6_x86_64` job it defines only runs automatically
# on mainline KDE repos ($KDECI_SECURE_SERVICES_KEY); everywhere else,
# including here, it appears as a manual pipeline job -- exactly what's
# needed to test the Craft build on KDE's real Windows CI runners without
# requiring mainline status or signing to be set up first.
#
# The qt-apps/seabass blueprint (craft-blueprint/qt-apps/seabass/) ships
# inside this repo rather than craft-blueprints-community, so CI doesn't
# depend on an upstream contribution landing first -- confirmed locally
# that Craft resolves a blueprint from an arbitrary [Blueprints]
# Locations entry with no dependency on the community repo at all. The
# .craft.ini in this checkout is what points Locations there; both the
# Windows and the macOS base template read it as CraftMaster's
# --config-override ($KDECI_CRAFT_PROJECT_CONFIG), so it needs no job of
# its own. Upstream to craft-blueprints-community once this has a real CI
# run behind it.
- project: sysadmin/ci-utilities
  file: /gitlab-templates/craft-windows-x86-64-qt6.yml

# macOS. The same blueprint, the same .craft.ini, a signed and notarized
# .dmg out the far end.
#
# There is no plain build-and-test template for macOS on Invent -- the
# whole macOS lane is Craft -- so this job packages, it does not run the
# test suite. Two reasons it cannot: craft-ci's CraftConfig.ini sets
# `/.buildTests = False` for every blueprint, and Craft carries only
# Boost's headers, while libdjinterop's vendored test suite wants
# Boost.Filesystem compiled. That is the same reason the blueprint
# configures -DSEABASS_TESTS=OFF. So a green job here means "it builds,
# links and packages on macOS", not "the 152 tests pass" -- those stay
# local until this repo has a .kde-ci.yml and a Linux build job.
#
# arm64 only, on purpose. KDE has a single macOS builder and both targets
# queue on it; the Intel one (craft-macos-x86-64-qt6.yml) cross-compiles
# on that same ARM machine, so it is a second, less-tested path for a
# device we have no way to verify on. Worth adding once arm64 has some
# green runs behind it.
#
# Verified locally before enabling: this blueprint produces
# seabass-macos-build-master-macos-clang-arm64.dmg (58 MB) against the
# same General/ABI = macos-clang-arm64 the CI target uses.
#
# Note the template's own rules run this automatically once
# $KDECI_SECURE_SERVICES_KEY is set, which it now is: Apple will not let
# an unsigned .dmg be useful, so the job signs, notarizes and publishes
# the build. Unlike the Windows job below, no allow_failure is added --
# nothing is known to be broken here, and a first run that fails should
# say so loudly rather than sit orange.
- project: sysadmin/ci-utilities
  file: /gitlab-templates/craft-macos-arm64-qt6.yml

# Intel, added now that the arm64 lane has run green on Invent
# (craft_macos_qt6_arm64, 6.2 min, pipeline 1354481) -- which was the
# condition for adding it rather than a preference.
#
# It exists because Rosetta only translates x86_64 to ARM and never the
# reverse, so an Intel user handed the arm64 .dmg gets a bundle that
# mounts and refuses to launch. That is the whole of the reason: not
# performance, not coverage, but a download that cannot work.
#
# This CROSS-COMPILES on KDE's single ARM macOS builder, so a green job
# here means it built, linked and packaged, never that it runs. The one
# functional check either of these lanes gets is a person, or a Rosetta
# smoke test on a developer machine, opening a stick and reading a
# catalog -- SQLCipher for OneLibrary is the dependency most likely to
# be quietly broken in a cross-built binary, and a launch alone does not
# exercise it. Label anything found that way manual-testing.
#
# Both targets queue on that one builder, so this roughly doubles the
# wall-clock of a full macOS pipeline. Worth it against shipping a
# download that does not start.
- project: sysadmin/ci-utilities
  file: /gitlab-templates/craft-macos-x86-64-qt6.yml
variables:
  SECRET_DETECTION_ENABLED: 'true'
secret_detection:
  stage: secret-detection
  # See the note above sast: this reads the source and must not be
  # gated behind a build.
  needs: []

# REUSE 3.0 compliance, as the KDE licensing policy requires: every file
# carries copyright and an SPDX licence identifier, and every licence used
# has its text in LICENSES/. Runs on the official FSFE image so the check
# is the same one reuse.software publishes.
reuse:
  stage: test
  # See the note above sast. A licence check that only runs when the
  # code compiles is a licence check that stops running exactly when
  # someone is busy and likely to paste a file in without a header.
  needs: []
  image:
    name: fsfe/reuse:latest
    entrypoint: [""]
  script:
  - reuse lint

# --- Windows Craft build: still runs and still reports, but does not
# --- fail the pipeline while a dependency of ours is broken upstream.
#
# Temporary, and dated: remove once libvpx builds on MSVC again.
#
# craft-blueprints-kde broke it on 2026-09-17 (06a004fb, "[libvpx] Update
# to 1.16.0 and enable on MSVC"). Its postInstall moves two files on MSVC
# and one of them is never produced:
#
#   [Errno 2] No such file or directory:
#     ...\libs\libvpx\image-RelWithDebInfo-1.16.0-dbg\lib\x64\vpxmd.pdb
#   Action: post-install for libs/libvpx:1.16.0 FAILED
#
# libvpx itself compiles cleanly; the packaging step after it is what
# fails. Seabass reaches libvpx through qtmultimedia -> ffmpeg, so the
# build dies in --install-deps, long before any Seabass code is compiled.
# Nothing here caused it and nothing here can fix it.
#
# It only began failing the pipeline when this repo gained KDE mainline
# status: the shared template (sysadmin/craft-ci,
# gitlab-templates/blocks/windows-base.yml) runs the job automatically
# wherever $KDECI_SECURE_SERVICES_KEY is set, and that rule leaves
# allow_failure at its default of false. Before the key existed the job
# was manual and explicitly allow_failure: true, so a broken dependency
# went unnoticed.
#
# The rules below are the template's own, with allow_failure added to the
# automatic branch. Written out in full rather than setting allow_failure
# at job level, because a matching rule supplies its own allow_failure
# and a job-level value would not reliably win. Overriding `rules`
# replaces the template's list outright; every other key of the job --
# image, tags, script, artifacts -- still comes from the template.
craft_windows_qt6_x86_64:
  rules:
  - if: $KDECI_SECURE_SERVICES_KEY
    when: on_success
    allow_failure: true
  - when: manual
    allow_failure: true

# ---- shared rule fragments ----
# "Full lane": nightly (a GitLab pipeline schedule -- see docs/ci.md for
# how to create one; there is no in-file cron syntax) and release tags
# run the whole thing, Windows included. An ordinary push/MR only runs
# the fast Linux lane below, and skips the slow `integration` ctest label
# (anonymized_fixture_integration_test, corpus_test) per docs/testing.md's
# existing "before merging a larger change or cutting a release" norm --
# nightly/release now actually enforces that instead of relying on habit.
.full_lane_rules: &full_lane_rules
  - if: '$CI_PIPELINE_SOURCE == "schedule"'
  - if: '$CI_COMMIT_TAG'

# ---- Linux: fast lane, every push/MR; full ctest label set on schedule/tag ----
#
# The one lane that gates ordinary pushes. Neither Craft template above
# runs the test suite -- the Windows one packages and the macOS one is
# build-and-package only (craft-ci sets /.buildTests = False) -- so
# without this, nothing on Invent has ever run ctest at all.
.linux_packages: &linux_packages
  - apt-get update -qq
  # The two -private-dev packages are what make Qt6::QuickLayouts
  # resolve, and the error does not say so. QuickLayouts' link
  # interface pulls in Qt6::GuiPrivate, whose
  # INTERFACE_INCLUDE_DIRECTORIES names
  # /usr/include/x86_64-linux-gnu/qt6/QtGui/<version> -- a directory
  # Ubuntu ships in qt6-base-private-dev, not qt6-base-dev. CMake
  # checks every path in an imported target's include list whether or
  # not anything compiles against it, so configure fails over a header
  # directory nothing here includes, and blames the one target whose
  # interface happens to mention GuiPrivate. Reproduced and confirmed
  # in this exact container on frame; both installed together without
  # bisecting which is strictly required.
  #
  # libxkbcommon-dev supplies the XKB::XKB target that Ubuntu's own
  # Qt6GuiTargets.cmake names in Qt6::GuiPrivate's link interface but
  # does not depend on. Without it configure dies inside Qt's own
  # cmake files, which reads as a Qt bug rather than a missing package.
  #
  # unzip and 7zip are TEST dependencies, and installing them is
  # the right answer rather than configuring them away:
  # backup_archive_crossvalidation_test reads archives Seabass wrote
  # using two implementations nobody here maintains. It is the check
  # that would catch us writing a zip only Seabass can open, which is
  # the one failure a backup format cannot afford. -DSEABASS_TESTS=OFF
  # would silence it and empty this lane of its purpose.
  #
  # fonts-noto-core ships NotoSansSymbols2-Regular.ttf, which is the
  # family Theme.symbolFamily falls back to when the BUNDLED subset fails
  # to load. The container has fontconfig and DejaVu (pulled in by Qt),
  # and DejaVu has no U+2B21/U+25CE/U+25C8 -- so LibrarySourceToggle's
  # glyphs painted nothing at all and two tests failed with "nothing was
  # painted in the row ... glyph ink -1..-1, name ink 39..47": the NAME
  # rendered, the glyph did not.
  #
  # SUSPICION WORTH CHASING, not settled here: the bundled font may be
  # failing to load everywhere, and every developer machine masks it by
  # having Noto installed for the fallback to find. This container is the
  # first environment without it, which is exactly when a bundled face is
  # supposed to earn its keep. Installing the system font makes the lane
  # green and does NOT prove the resource loads. Someone should make the
  # test report Theme.symbolFont.status when it fails, rather than only
  # "nothing was painted".
  #
  # qt6-svg-plugins is the one that decodes SVG, and qt6-svg-dev does NOT
  # pull it in. Without it libQt6Svg is present and linkable, the build
  # succeeds, and then every bundled Breeze icon fails at RUN time with
  # "Error decoding: ...svg: Unsupported image format" -- 14 QML tests
  # red across both suites on the first run that ever reached them,
  # including ones whose names say nothing about images ("the Home icon
  # has no size", "nothing was painted in the row"). Found by looking up
  # which Ubuntu package ships
  # /usr/lib/x86_64-linux-gnu/qt6/plugins/imageformats/libqsvg.so rather
  # than by guessing at names: on KDE neon that file comes from a package
  # called qt6-svg, which is a different distro's split and would have
  # been the wrong answer here.
  #
  # ca-certificates is not optional and not obvious: the ubuntu image
  # ships none, apt itself does not need any (its sources are
  # plain http), and so the gap only shows up later, when CMake runs
  # `git submodule update` at configure time and git cannot verify
  # github.com. It reads as "Failed to initialize git submodules"
  # rather than as a missing package -- see pipeline 1353951, where
  # both submodules failed with "server certificate verification
  # failed. CAfile: none".
  #
  # qt6-svg-plugins is separate from qt6-svg-dev and is the package
  # that actually decodes an SVG. qt6-svg-dev brings libQt6Svg, which
  # is a rendering library; the QImageIOHandler that lets QML's Image
  # open a .svg at all lives in
  # qt6/plugins/imageformats/libqsvg.so, and Ubuntu ships that in
  # qt6-svg-plugins -- reachable only as a Recommends, which
  # --no-install-recommends above drops. Every Seabass icon is a
  # bundled Breeze SVG (src/gui/CMakeLists.txt's qt_add_resources
  # list), so without it the suite fails twelve times over with
  # "Error decoding: qrc:/qt/qml/SeabassGui/qml/icons/breeze/
  # go-home.svg: Unsupported image format" -- and the failures read
  # as pixel and layout bugs ("the Home icon has no size", "nothing
  # was painted in the row", "the watermark does not reach the
  # window's right edge any more") rather than as a missing package.
  # See pipeline 1354151, job 5051803.
  # fc-cache after the installs, not before, and not skipped as a
  # formality: fonts-noto-core lands after the image's fontconfig cache
  # was built, and an unindexed font is invisible to Qt's fallback even
  # though the file is on disk. Installing the font alone did NOT fix
  # the glyph tests, which is what pointed here.
  #
  # The fc-list line is the diagnostic that settles it either way: if
  # Symbols2 is listed and the glyphs still ink nothing, the fault is
  # not font availability and nobody should spend another run on fonts.
  - apt-get install -y -qq --no-install-recommends
      ca-certificates
      build-essential cmake ninja-build git pkg-config
      libsqlite3-dev zlib1g-dev libsqlcipher-dev libtag1-dev
      qt6-base-dev qt6-declarative-dev qt6-multimedia-dev qt6-svg-dev
      qt6-svg-plugins
      qt6-shadertools-dev qt6-tools-dev qt6-l10n-tools libqt6qml6
      xvfb unzip 7zip libxkbcommon-dev
      qt6-base-private-dev qt6-declarative-private-dev
      ccache
      fonts-noto-core
  - fc-cache -f
  # Block scalars, NOT plain ones. A colon followed by a space inside an
  # unquoted YAML scalar turns the whole shell command into a MAPPING:
  # `- echo "fonts seen: $(...)"` parses as {'echo "fonts seen': '$(...)'},
  # GitLab then finds a non-string in before_script, every job using this
  # anchor becomes invalid, and the pipeline is created with ZERO jobs and
  # a null yaml_errors. That is what ceb519fa did to master. `- |` has no
  # such trap, which is why the cgroup block below uses it too.
  - |
    echo "fonts visible to fontconfig: $(fc-list | wc -l) total, $(fc-list | grep -ci symbols) matching symbols"
    fc-list | grep -i symbols | head -3 || echo "  NO Symbols font is visible to fontconfig"


# One job, not two. It builds AND tests, and the reason is the 4.3 GB
# `artifacts: paths: [build]` this used to carry: that artifact existed
# for exactly one purpose, handing the built tree to a separate
# linux:test in a fresh container. Uploading a full build directory to
# do it costs more than rebuilding would, blows past artifact limits,
# and is charged against the same one-hour budget the compile already
# could not fit inside. Merged, the tree never has to move at all.
#
# The cost of merging, stated plainly: a red test leaves no build
# behind to poke at. That is the right trade here -- the tree is
# reproducible from the sha, and 4.3 GB is not worth moving to save a
# rebuild -- but it is a real loss and not an oversight.
linux:build-test:
  stage: build
  # No `tags:`. A bare `linux` tag matched no runner on Invent, so this
  # job sat pending until it timed out and failed with
  # stuck_pending_no_matching_runners -- and because it is the first
  # stage and allow_failure is false, it took every other job of every
  # pipeline down with it, including the macOS build that was working.
  # KDE's shared container runners take untagged jobs: `reuse` and
  # `semgrep-sast` are untagged and have always run. Confirmed against
  # pipeline 1352819, where the only difference between the jobs that
  # ran and the one that did not was this line.
  #
  # 26.04 rather than 24.04, and it has to be at least this new: Qt is
  # what decides. src/gui/main.cpp calls QQmlApplicationEngine's
  # loadFromModule, which arrived in Qt 6.5; 24.04 ships 6.4.2, so that
  # image configured cleanly and then failed 1156 objects later with
  # "no member named loadFromModule" -- an error that says nothing about
  # versions. 26.04 LTS ships Qt 6.10.2 with GCC 15.2, which is past the
  # 6.8 this project now requires (see find_package in CMakeLists).
  #
  # p7zip-full does not exist on 26.04; 7zip replaces it and still
  # provides /usr/bin/7z, which is the binary the cross-validation test
  # shells out to.
  image: ubuntu:26.04
  # An hour was never enough and never will be. Measured on this
  # runner from pipeline 1354103's own log: objects 1-500 took 10
  # minutes, 501-1000 took 19, 1001-1500 took 23, and the job was
  # killed at 1585 of 1859 -- the deceleration is the Qt-heavy GUI
  # translation units arriving at the end. Extrapolated, the build
  # alone wants 75-80 minutes, and the tests come after it.
  #
  # This is a ceiling, not a target: with a warm ccache below, a rerun
  # should finish in a small fraction of it. If the runner refuses this
  # value the job fails immediately with a message saying so, which is
  # a far better failure than an hour of compiling thrown away.
  timeout: 3h
  variables:
    # Inside CI_PROJECT_DIR because that is the only place GitLab's
    # `cache:` can reach.
    CCACHE_DIR: "$CI_PROJECT_DIR/.ccache"
    CCACHE_MAXSIZE: "3G"
    # `content` rather than ccache's default mtime check: the compiler
    # here comes from an apt image that is rebuilt upstream without
    # warning, and an mtime that moved while the compiler did not would
    # throw away a whole cache for nothing.
    CCACHE_COMPILERCHECK: content
  cache:
    # Versioned by hand. Bump the suffix to throw the cache away
    # deliberately; nothing else should.
    key: linux-ccache-v1
    paths:
      - .ccache
  before_script: *linux_packages
  # Spelled out rather than reusing &full_lane_rules: a YAML merge key
  # (<<:) merges a *mapping* into another mapping -- it cannot expand a
  # multi-item list (what that anchor is) into several rule entries each
  # gaining their own `variables:` key, so this has to stay explicit.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      variables:
        CTEST_LABEL_ARGS: ""
    - if: '$CI_COMMIT_TAG'
      variables:
        CTEST_LABEL_ARGS: ""
    - when: on_success
      variables:
        CTEST_LABEL_ARGS: "-LE integration"
  script:
    # -DSEABASS_LIBDJINTEROP_TESTS=OFF for the same reason the Craft
    # blueprint passes it (craft-blueprint/qt-apps/seabass/seabass.py):
    # the vendored libdjinterop's own test suite wants Boost.Filesystem
    # compiled, and only the headers are here. Installing
    # libboost-filesystem-dev would work too, but this lane exists to run
    # SEABASS's tests -- a vendored dependency's suite failing would red
    # the gate for something nothing in this repo controls.
    #
    # -O1, via CMAKE_CXX_FLAGS_RELEASE. This was reverted two commits ago
    # on a local measurement of 7.4% (462 s to 428 s at -j4) and is back,
    # because that inference was wrong even though the number was honest:
    # at -j4 on a desktop with memory bandwidth to spare -O3 costs little,
    # while on the runner at -j12 over huge Qt translation units it is
    # worth about 2x. Object 1000 arrived at 15.9 min with -O1 against
    # 29.3 without, on the same lane days apart. A local build does not
    # predict this runner: it is ~30x slower per core-second than the
    # desktop, with ~3x run-to-run variance.
    #
    # The cost is real and accepted: CI no longer proves the -O3 build
    # compiles. The Craft Windows and macOS lanes still build at their
    # own optimisation levels, and e2e testing covers the rest.
    #
    # Recorded because the measurement trap is the useful part:
    # -DCMAKE_CXX_FLAGS=-O1 does NOTHING against a Release build, since
    # CMake emits CMAKE_CXX_FLAGS before CMAKE_CXX_FLAGS_<CONFIG>, so the
    # command line reads "-O1 -O3" and GCC takes the last one. The first
    # attempt at this comparison measured -O3 against itself and would
    # have "proved" the flag was worthless for the wrong reason. If
    # anyone tries again, the knob is CMAKE_CXX_FLAGS_RELEASE and the
    # check is compile_commands.json.
    - cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      -DSEABASS_LIBDJINTEROP_TESTS=OFF
      -DCMAKE_CXX_FLAGS_RELEASE="-O1 -DNDEBUG"
      -DCMAKE_C_COMPILER_LAUNCHER=ccache
      -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
    # How much machine this container actually has, printed before it is
    # used. `nproc` on a shared runner reports the HOST's cores, not the
    # cgroup's quota, and Ninja's default job count is nproc + 2 -- so a
    # container allowed two cores can end up running eighteen compilers,
    # which is a plausible reading of why the build decelerated from 50
    # objects a minute to 21 as the memory-hungry Qt translation units
    # arrived. Computing the job count from the cgroup quota instead
    # costs nothing and makes the next log say which it was.
    - |
      QUOTA=$(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo "max 100000")
      set -- $QUOTA
      if [ "$1" = "max" ]; then JOBS=$(nproc); else JOBS=$(( ($1 + $2 - 1) / $2 )); fi
      [ "$JOBS" -lt 1 ] && JOBS=1
      echo "nproc says $(nproc); cgroup cpu.max says '$QUOTA'; building with -j$JOBS"
      echo "memory: $(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo unknown) cgroup, $(awk '/MemTotal/{print $2" kB"}' /proc/meminfo) host"
      echo "qt imageformats plugins: $(ls /usr/lib/*/qt6/plugins/imageformats/ 2>/dev/null | tr '\n' ' ')"
      cmake --build build -j"$JOBS"
    # Printed, not silent -- and what it printed corrected me. The
    # cache section reports "No URL provided, cache will not be
    # downloaded": this GitLab instance has no cache storage configured,
    # so `cache:` does NOTHING here and ccache never persists between
    # runs. Three runs in a row scored exactly 452/1307 (34.58%), which
    # is not a cache being warm, it is the SAME intra-run number every
    # time.
    #
    # It is still worth having, for a reason that has nothing to do with
    # persistence: CMakeLists lists 301 source files across its
    # add_executable() blocks and 194 of them are re-compiles of a file
    # another target already compiles (work_counters.cpp thirty times,
    # durable_file_write.cpp twenty-two). ccache collapses those within
    # a single run. What it cannot do here is make the NEXT run cheap,
    # so every run is a cold build and the lane must fit in its budget
    # on that basis.
    - ccache --show-stats
    # As a NORMAL USER, not as root. CI containers run as root, and
    # root ignores the file permissions several tests take away on
    # purpose: durable_file_write_test drops write on a directory and
    # requires the write to fail, and add_cue_mirror_failure_test and
    # pending_deletion_applier_test do the same. As root those writes
    # SUCCEED and the assertions fail -- and the worse version of this
    # is a test that asserts the other way round and passes without
    # proving anything. Measured in this exact image: three abort as
    # root, all three pass as a user.
    #
    # .ccache is left owned by root on purpose: chowning it would make
    # the cache upload rewrite every file for no benefit.
    - useradd -m runner
    - chown -R runner build
    - su runner -c "cd build && ctest --output-on-failure $CTEST_LABEL_ARGS"

# ---- Linux: the package, on a release tag only ----
#
# A tarball of the two binaries and the desktop/icon files, not an
# AppImage: it needs the distribution's own Qt 6 and says so in the
# README it carries. That is honest for alpha and beta, where the people
# downloading it are the people who can read that sentence, and it is not
# good enough for a stable release aimed at DJs -- see docs/releasing.md,
# "What is still by hand".
#
# Its own configure rather than reusing linux:build's tree: that one is a
# test build (SEABASS_TESTS on, channel "dev"), and a release package has
# to carry the channel it was tagged with, because the app shows it and
# the update check compares against it.
linux:package:
  stage: package
  image: ubuntu:26.04
  # No `needs:`, on purpose. Naming a job ties this to whatever the Linux
  # lane is called this week, and a `needs:` pointing at a job that no
  # longer exists is not one red job -- GitLab calls the whole pipeline
  # invalid and nothing runs at all. Stage order is the stronger gate
  # anyway: `package` comes after `build` and `test`, so this waits for
  # every one of them, whatever they are named and however they are
  # split. A package is not built from a tree whose tests have not
  # passed.
  rules:
    - if: '$CI_COMMIT_TAG'
  # Measured, not guessed: this build is SEABASS_TESTS=OFF, which is 505
  # ninja edges against the test lane's 1859 -- roughly three quarters of
  # that lane is the suite, which a package does not contain. But the
  # runner varies about threefold between runs from host contention (the
  # same object took 15.9 and 29.3 minutes on consecutive runs), so a
  # number that fits comfortably today can fail tomorrow on identical
  # work. Whether a job timeout above the hour is honoured here is not
  # established; if this ever fails at exactly 1h, that is the answer.
  timeout: 2h
  before_script: *linux_packages
  script:
    - . tools/release-version.sh
    # Refuses a tag whose version disagrees with CMakeLists.txt, before
    # anything is built under a name that would then be wrong.
    - seabass_release_from_tag . "$CI_COMMIT_TAG"
    - cmake -S . -B build-rel -G Ninja -DCMAKE_BUILD_TYPE=Release
        -DSEABASS_LIBDJINTEROP_TESTS=OFF -DSEABASS_TESTS=OFF
        -DSEABASS_RELEASE_CHANNEL="$SEABASS_CHANNEL"
    - cmake --build build-rel --target seabass seabass-cli
    - name="seabass-${SEABASS_VERSION}_${SEABASS_CHANNEL}_linux"
    - mkdir -p "stage/$name/bin" package-out
    - cp build-rel/seabass build-rel/seabass-cli "stage/$name/bin/"
    - cp README.md LICENSES/* "stage/$name/" 2>/dev/null || true
    - |
      cat > "stage/$name/README-package.txt" <<EOF
      Seabass $SEABASS_VERSION ($SEABASS_CHANNEL), Linux x86_64.

      Run bin/seabass. This package carries Seabass only: it uses the Qt 6
      your distribution ships (Qt 6.5 or newer, with QtQuick, QtMultimedia,
      QtSvg and the shader tools runtime), plus sqlite3, zlib, sqlcipher
      and taglib. On Ubuntu/Debian:

        sudo apt install qt6-base qt6-declarative qt6-multimedia qt6-svg \
             libsqlite3-0 zlib1g libsqlcipher0 libtag1v5

      Built from $CI_COMMIT_SHA.
      EOF
    - tar -czf "package-out/$name.tar.gz" -C stage "$name"
    - sha256sum "package-out/$name.tar.gz"
  artifacts:
    paths: [package-out/*.tar.gz]
    expire_in: 1 year

# ---- Windows: full lane only (build, test, package, installer-test) ----
# The MSYS2/UCRT64 build, which is a different thing from the Craft job
# above: Craft builds and signs what KDE ships, this builds what
# docs/windows-build.md describes, runs the suite on Windows, and then
# installs and uninstalls the Inno Setup installer to check it works.
# Nothing else in this project ever exercises the installer.
#
# Needs a self-hosted GitLab Runner tagged `windows` -- there are no
# shared Windows runners on KDE Invent. Until one is registered these
# jobs have nothing to run on, which is why they are kept off every
# push: see docs/ci.md, which is also where the registration is written
# down.
windows:build:
  stage: build
  tags: [windows]
  rules: *full_lane_rules
  script:
    - $env:PATH = "C:\msys64\ucrt64\bin;" + $env:PATH
    - cmake -S . -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release
    - cmake --build build-win --target seabass-cli
    - cmake --build build-win --target seabass
  artifacts:
    paths: [build-win]
    expire_in: 1d

windows:test:
  stage: test
  tags: [windows]
  needs: [windows:build]
  rules: *full_lane_rules
  script:
    - $env:PATH = "C:\msys64\ucrt64\bin;" + $env:PATH
    - cd build-win
    - ctest --output-on-failure

windows:package:
  stage: package
  tags: [windows]
  needs: [windows:test]
  rules: *full_lane_rules
  script:
    - $env:PATH = "C:\msys64\ucrt64\bin;" + $env:PATH
    - .\tools\deploy-windows.ps1
    # The version the tag names, not the literal in the .iss: an
    # installer called 0.1.0 built from the 0.3.0 tag is the kind of
    # thing nobody notices until a user reports a bug against the wrong
    # release. Without a tag the .iss keeps its own default.
    - |
      $ver = ""
      if ($env:CI_COMMIT_TAG) { $ver = ($env:CI_COMMIT_TAG -split "/")[-1] }
      $chan = "dev"
      if ($env:CI_COMMIT_TAG) { $chan = ($env:CI_COMMIT_TAG -split "/")[-2] }
      $defs = @()
      if ($ver) { $defs += "/DMyAppVersion=$ver"; $defs += "/DMyAppChannel=$chan" }
      # Quoted path: "Inno Setup 6" has a space in it.
      & "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe" @defs tools\windows-installer.iss
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      if ($ver) {
        $out = "installer-out\seabass-${ver}_${chan}_windows.exe"
        Move-Item -Force (Get-ChildItem installer-out\*.exe | Select-Object -First 1).FullName $out
      }
  artifacts:
    paths: [installer-out/*.exe]
    expire_in: 1 year

windows:installer-test:
  stage: installer-test
  tags: [windows]
  needs: [windows:package]
  rules: *full_lane_rules
  script:
    - .\tools\test-installer.ps1
